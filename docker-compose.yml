services:
  postgres:
    image: postgres:16-alpine
    container_name: foosball-elo-tracker-postgres
    environment:
      POSTGRES_USER: foosball
      POSTGRES_PASSWORD: foosball
      POSTGRES_DB: foosball
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foosball"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
